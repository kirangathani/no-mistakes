name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and .release-please-manifest.json; its PR
    # is the one legitimate place those files change, so we exempt its author.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      # This repository is a fork of kunchenguid/no-mistakes, and merging
      # upstream legitimately carries upstream's own release-please output.
      # The guard allows a generated file only when it is byte-identical to
      # upstream's main at the upstream commit the PR merged (the script owns
      # the rule). A failed fetch leaves no ref, which fails closed to the
      # strict check.
      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/kunchenguid/no-mistakes.git +main:refs/remotes/upstream/main || echo "::warning::could not fetch upstream main; no upstream exemption"

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/guard-generated-files.sh "${BASE_SHA}" "${HEAD_SHA}" refs/remotes/upstream/main
